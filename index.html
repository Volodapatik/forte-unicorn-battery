<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Forte Unicorn EV — Чесний заряд</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(160deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.4;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.15);
        }

        h1 {
            font-size: 1.45rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 6px;
            color: #f8fafc;
            letter-spacing: -0.02em;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="number"] {
            width: 100%;
            padding: 18px 16px;
            font-size: 1.25rem;
            border: 2px solid #334155;
            border-radius: 16px;
            background: #0f172a;
            color: #f1f5f9;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"]:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.2);
        }

        button {
            width: 100%;
            padding: 18px;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: white;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.35);
            margin-bottom: 28px;
        }

        button:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        .result-box {
            text-align: center;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 16px 8px;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        .percent {
            font-size: 3.2rem;
            font-weight: 800;
            color: #38bdf8;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
            line-height: 1;
        }

        .percent-label {
            font-size: 1.05rem;
            color: #94a3b8;
            margin-bottom: 16px;
        }

        .status {
            font-size: 1.05rem;
            font-weight: 500;
            color: #e2e8f0;
            line-height: 1.45;
            padding: 0 4px;
        }

        .status.high { color: #4ade80; }
        .status.good { color: #38bdf8; }
        .status.mid  { color: #fbbf24; }
        .status.low  { color: #f87171; }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.75rem;
            color: #64748b;
        }

        .empty .percent {
            font-size: 1.4rem;
            color: #64748b;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Forte Unicorn EV</h1>
        <p class="subtitle">Чесний калькулятор заряду батареї</p>

        <div class="input-group">
            <label for="voltage">Напруга батареї (В)</label>
            <input 
                type="number" 
                id="voltage" 
                step="0.01" 
                min="0" 
                max="100"
                placeholder="Введіть вольти (наприклад, 75.34)"
                inputmode="decimal"
            >
        </div>

        <button id="calcBtn">РОЗРАХУВАТИ</button>

        <div class="result-box empty" id="resultBox">
            <div class="percent" id="percentDisplay">—</div>
            <div class="percent-label" id="percentLabel">Чесний заряд</div>
            <div class="status" id="statusText">Введіть вольти і натисніть кнопку</div>
        </div>

        <p class="footer">Точна лінійна інтерполяція · Dark Mode</p>
    </div>

    <script>
        // Опорні точки (відсортовані за зростанням напруги)
        const points = [
            { v: 62.00, p: 0 },
            { v: 68.50, p: 10 },
            { v: 72.00, p: 20 },
            { v: 72.80, p: 30 },
            { v: 73.50, p: 40 },
            { v: 74.40, p: 50 },
            { v: 75.50, p: 60 },
            { v: 76.80, p: 70 },
            { v: 78.50, p: 80 },
            { v: 80.50, p: 90 },
            { v: 84.00, p: 100 }
        ];

        function calculatePercent(voltage) {
            if (isNaN(voltage)) return null;
            if (voltage <= 62.00) return 0;
            if (voltage >= 84.00) return 100;

            for (let i = 0; i < points.length - 1; i++) {
                const lower = points[i];
                const upper = points[i + 1];

                if (voltage >= lower.v && voltage <= upper.v) {
                    const ratio = (voltage - lower.v) / (upper.v - lower.v);
                    const percent = lower.p + ratio * (upper.p - lower.p);
                    return Math.round(percent);
                }
            }
            return null;
        }

        function getStatus(percent) {
            if (percent >= 80) {
                return {
                    text: "Повний заряд! Скутер рве з місця. До Жашкова долетить! 🚀",
                    className: "high"
                };
            }
            if (percent >= 50) {
                return {
                    text: "Хороший робочий заряд. 2-га передача — твій найкращий вибір. 👍",
                    className: "good"
                };
            }
            if (percent >= 20) {
                return {
                    text: "Заряд тане! Пора плавно планувати дорогу до хліва і розетки. 🔌",
                    className: "mid"
                };
            }
            return {
                text: "🚨 АВАРІЙНИЙ СТАН! Їдь дуже повільно на 1-й передачі, бо зараз вирубиться захист BMS!",
                className: "low"
            };
        }

        function updateUI() {
            const input = document.getElementById('voltage');
            const voltage = parseFloat(input.value);
            const percent = calculatePercent(voltage);

            const resultBox = document.getElementById('resultBox');
            const percentDisplay = document.getElementById('percentDisplay');
            const percentLabel = document.getElementById('percentLabel');
            const statusText = document.getElementById('statusText');

            if (percent === null) {
                resultBox.classList.add('empty');
                percentDisplay.textContent = '—';
                percentLabel.textContent = 'Чесний заряд';
                statusText.textContent = 'Введіть коректне значення вольт';
                statusText.className = 'status';
                return;
            }

            resultBox.classList.remove('empty');
            percentDisplay.textContent = percent + '%';
            percentLabel.textContent = 'Чесний заряд';

            const status = getStatus(percent);
            statusText.textContent = status.text;
            statusText.className = 'status ' + status.className;
        }

        document.getElementById('calcBtn').addEventListener('click', updateUI);

        document.getElementById('voltage').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                updateUI();
            }
        });

        // Service Worker registration for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
